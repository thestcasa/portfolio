services:
  - type: web
    runtime: static
    name: alessandro-casadei-static
    autoDeployTrigger: checksPass
    buildCommand: python -m pip install -r requirements.txt && python scripts/build_static.py
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://alessandro-casadei.onrender.com; font-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'"
      - path: /static/*
        name: Cache-Control
        value: public, max-age=86400
