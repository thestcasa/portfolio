<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#e9e5da"/><text x="72" y="90" font-family="Arial" font-size="24" fill="#171816">Credit default / behaviour → model → operating threshold</text><text x="72" y="125" font-family="Arial" font-size="16" fill="#64645f">Imbalance handled through evaluation and threshold selection, not by pretending 0.5 is neutral.</text><g stroke="#171816" stroke-width="2" fill="none"><path d="M230 350H350M530 350H650M830 350H950"/></g><g font-family="Arial" fill="#171816"><rect x="70" y="280" width="160" height="140" fill="#f3f0e8" stroke="#171816"/><text x="96" y="322" font-size="18">Raw behaviour</text><text x="96" y="352" font-size="13">repayment history</text><text x="96" y="374" font-size="13">bills / payments / limits</text><rect x="350" y="260" width="180" height="180" fill="#f3f0e8" stroke="#171816"/><text x="380" y="305" font-size="18">Features</text><text x="380" y="337" font-size="13">severity + persistence</text><text x="380" y="360" font-size="13">utilisation + capacity</text><text x="380" y="383" font-size="13">recent vs historical</text><rect x="650" y="260" width="180" height="180" fill="#f3f0e8" stroke="#171816"/><text x="688" y="310" font-size="20">CatBoost</text><text x="688" y="344" font-size="13">stratified CV</text><text x="688" y="370" font-size="13">reproducible config</text><rect x="950" y="245" width="190" height="210" fill="#2548ff" stroke="#171816"/><text x="985" y="300" font-size="17" fill="white">Threshold 0.328</text><text x="985" y="348" font-size="30" fill="white">0.721</text><text x="985" y="377" font-size="14" fill="white">Macro F1</text><text x="985" y="417" font-size="22" fill="white">1st place</text></g><text x="72" y="650" font-family="monospace" font-size="14" fill="#2548ff">delay severity · repayment persistence · utilization · threshold optimization · leaderboard evidence</text></svg>