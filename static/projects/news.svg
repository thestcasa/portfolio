<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#e9e5da"/><text x="72" y="90" font-family="Arial" font-size="24" fill="#171816">News classification / defensible evaluation pipeline</text><text x="72" y="125" font-family="Arial" font-size="16" fill="#64645f">The model sits downstream of schema, leakage, duplicate and drift checks.</text><g stroke="#171816" stroke-width="2" fill="none"><path d="M245 350H325M515 350H595M785 350H865"/></g><g font-family="Arial" fill="#171816"><rect x="65" y="265" width="180" height="170" fill="#f3f0e8" stroke="#171816"/><text x="95" y="307" font-size="18">Audit inputs</text><text x="95" y="338" font-size="13">schema</text><text x="95" y="361" font-size="13">duplicates / overlap</text><text x="95" y="384" font-size="13">drift / missingness</text><rect x="325" y="265" width="190" height="170" fill="#f3f0e8" stroke="#171816"/><text x="355" y="307" font-size="18">Sparse features</text><text x="355" y="338" font-size="13">word + char TF-IDF</text><text x="355" y="361" font-size="13">source + page rank</text><text x="355" y="384" font-size="13">time + missingness</text><rect x="595" y="265" width="190" height="170" fill="#f3f0e8" stroke="#171816"/><text x="625" y="307" font-size="18">Stratified CV</text><text x="625" y="338" font-size="13">Linear SVM</text><text x="625" y="361" font-size="13">per-class metrics</text><text x="625" y="384" font-size="13">OOF diagnostics</text><rect x="865" y="265" width="260" height="170" fill="#2548ff" stroke="#171816"/><text x="902" y="307" font-size="18" fill="white">Full-data retrain</text><text x="902" y="340" font-size="13" fill="white">predictions + model artifact</text><text x="902" y="367" font-size="13" fill="white">confusion / distribution reports</text></g><text x="72" y="650" font-family="monospace" font-size="14" fill="#2548ff">data quality first · high-dimensional sparse modeling · fold-level evidence · reproducible entry point</text></svg>